# GitHub Actions workflow that runs the panel theme style audit on public asset changes.
#
# code-index:begin
# {
#  "purpose": "GitHub Actions workflow that runs the panel theme style audit on public asset changes.",
#  "read_when": "When changing panel CSS/JS under nce_events/public or scripts/style-audit and need CI coverage.",
#  "gotchas": [],
#  "keywords": ["style audit", "GitHub Actions", "theme contract", "panel", "public", "CI"],
#  "format": 1
# }
# code-index:end

name: Panel style audit

on:
  push:
    branches: [main]
    paths:
      - "nce_events/public/**"
      - "scripts/style-audit.*"
      - ".github/workflows/style-audit.yml"
  pull_request:
    paths:
      - "nce_events/public/**"
      - "scripts/style-audit.*"
      - ".github/workflows/style-audit.yml"

jobs:
  theme-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/style-audit.sh
